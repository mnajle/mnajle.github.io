<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximiliano Najle</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="content">
        <div class="left-side">
            <div class="header">
                <div class="name">Maximiliano Najle</div>
                <p class="greet">Software Developer · <span class="arg">Buenos Aires, Argentina</span></p>
            </div>
            <div class="ctas">
                <div x-data="{ copied: false }">
                    <button class="cta"
                        @click="
                            navigator.clipboard.writeText('maximilianonajle@gmail.com');
                            copied = true;
                            setTimeout(() => copied = false, 2000)
                        "
                        :class="{ 'cta--done': copied }">
                        <span x-text="copied ? 'Copied!' : 'Send me an email'"></span>
                    </button>
                </div>
                <a class="cta" href="https://www.linkedin.com/in/mnajle/" target="_blank">
                    <span>Connect on LinkedIn</span>
                </a>
                <a class="cta" href="/cv.pdf" download="cv.pdf">
                    <span>Download CV</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
